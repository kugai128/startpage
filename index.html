<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的起始页</title>
    <!-- 主题初始化：避免 FOUC 闪烁 -->
    <script>
      (function() {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch(e) {}
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!-- favicon 源 DNS 预解析，加速首次图标加载 -->
    <link rel="dns-prefetch" href="https://www.google.com">
    <link rel="dns-prefetch" href="https://t2.gstatic.com">
    <link rel="dns-prefetch" href="https://api.faviconkit.com">
    <link rel="dns-prefetch" href="https://icons.duckduckgo.com">
    <!-- 引入样式文件 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 背景氛围层 —— 保险底色 + 呼吸光斑 + 漂浮微粒 -->
    <div class="ambient-base"></div>
    <div class="ambient-blobs">
        <div class="ambient-blob ambient-blob--blue"></div>
        <div class="ambient-blob ambient-blob--pink"></div>
    </div>
    <div class="ambient-particles" id="ambientParticles"></div>

    <!-- === 卡片容器三层结构 === -->
    <div class="container">
        <div class="layer-clock">
            <h1 id="clock">00:00:00</h1>
        </div>

        <div class="layer-search">
            <div class="search-box">
                <div class="search-field" id="searchField">
                    <!-- 搜索引擎选择器 -->
                    <div class="engine-selector" id="engineSelector">
                        <button
                            class="engine-current"
                            id="engineCurrent"
                            type="button"
                            aria-haspopup="listbox"
                            aria-expanded="false"
                            aria-label="选择搜索引擎"
                        >
                            <span class="engine-icon" id="engineIcon">🔍</span>
                            <span class="engine-name" id="engineName">百度</span>
                            <svg class="engine-arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <ul class="engine-dropdown" id="engineDropdown" role="listbox" tabindex="-1"></ul>
                    </div>

                    <!-- 搜索输入框 -->
                    <input type="text" id="search" placeholder="用百度搜索..." autocomplete="off" aria-label="搜索关键词">
                </div>

                <ul id="suggestions" class="suggestions"></ul>
            </div>
        </div>

        <div class="layer-bookmark">
            <div id="bookmarkGrid" class="bookmark-grid"></div>
        </div>
    </div>

    <!-- === 时间问候语（全局底部） === -->
    <p class="greeting-footer" id="greetingText"></p>

    <!-- 设置按钮 -->
    <button class="settings-btn" id="settingsBtn" aria-label="设置">⚙️</button>

    <!-- 引入逻辑文件，放在 body 结束标签前 -->
    <script src="js/theme.js"></script>
    <script src="js/background.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/search.js"></script>
    <script src="js/ambience.js"></script>
    <script src="js/bookmark-manager.js"></script>
    <script src="js/greeting.js"></script>
</body>
</html>
