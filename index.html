<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的起始页</title>
    <!-- 引入样式文件 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 背景氛围层 —— 保险底色 + 呼吸光斑 + 漂浮微粒 -->
    <div class="ambient-base"></div>
    <div class="ambient-blobs">
        <div class="ambient-blob ambient-blob--blue"></div>
        <div class="ambient-blob ambient-blob--pink"></div>
    </div>
    <div class="ambient-particles" id="ambientParticles"></div>

    <div class="container">
        <h1 id="clock">00:00:00</h1>

        <div class="search-box">
            <div class="search-field" id="searchField">
                <!-- 搜索引擎选择器 -->
                <div class="engine-selector" id="engineSelector">
                    <button
                        class="engine-current"
                        id="engineCurrent"
                        type="button"
                        aria-haspopup="listbox"
                        aria-expanded="false"
                        aria-label="选择搜索引擎"
                    >
                        <span class="engine-icon" id="engineIcon">🔍</span>
                        <span class="engine-name" id="engineName">百度</span>
                        <svg class="engine-arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <ul class="engine-dropdown" id="engineDropdown" role="listbox" tabindex="-1"></ul>
                </div>

                <!-- 搜索输入框 -->
                <input type="text" id="search" placeholder="用百度搜索..." autocomplete="off" aria-label="搜索关键词">
            </div>

            <ul id="suggestions" class="suggestions"></ul>
        </div>

        <div id="bookmarkGrid" class="bookmark-grid"></div>

        <div class="links">
            <div class="link-card">
                <a href="https://bilibili.com" aria-label="B站">
                    <svg viewBox="0 0 32 32" fill="none" stroke="#5A4A42" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="8" width="24" height="17" rx="4"/>
                        <line x1="10" y1="8" x2="13" y2="3"/>
                        <line x1="22" y1="8" x2="19" y2="3"/>
                        <line x1="4" y1="18" x2="28" y2="18"/>
                        <circle cx="12" cy="14" r="1.5" fill="#5A4A42" stroke="none"/>
                        <circle cx="20" cy="14" r="1.5" fill="#5A4A42" stroke="none"/>
                    </svg>
                </a>
            </div>
            <div class="link-card">
                <a href="https://github.com" aria-label="GitHub">
                    <svg viewBox="0 0 32 32" fill="none" stroke="#5A4A42" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 26v-4c-3 .6-4.5-1.3-5-2.5"/>
                        <path d="M17 26v-3c0-2 1-3 2-3.5s2-1.5 2-3.5v-2c0-2-1-3-2-3.5"/>
                        <path d="M10 26c-1 0-2-.4-2-2v-2c0-2 1-3 2-3.5"/>
                        <path d="M6 18c-1.5 1-2 3-1 5"/>
                    </svg>
                </a>
            </div>
            <div class="link-card">
                <a href="https://zhihu.com" aria-label="知乎">
                    <svg viewBox="0 0 32 32" fill="none" stroke="#5A4A42" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 7h13v16"/>
                        <path d="M12 13h7"/>
                        <path d="M12 18h5"/>
                        <path d="M21 7l3 16"/>
                        <path d="M24 12h4"/>
                    </svg>
                </a>
            </div>
            <div class="link-card">
                <a href="https://youtube.com" aria-label="YouTube">
                    <svg viewBox="0 0 32 32" fill="none" stroke="#5A4A42" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="7" width="26" height="18" rx="5"/>
                        <polygon points="13,11 21,16 13,21" fill="#5A4A42" stroke="none"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <!-- 引入逻辑文件，放在 body 结束标签前 -->
    <script src="main.js"></script>
    <script src="js/search.js"></script>
    <script src="js/ambience.js"></script>
    <script src="js/bookmark-manager.js"></script>
</body>
</html>
